name: build

on:
  push:
    branches: [main, next]
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Driver sources and tests are -Wall -Wextra -Werror via CMakeLists
      # (the core submodule is upstream code and is not).
      # The harnesses below run this build: its M-code answer wait is 5 s,
      # not the image's 30 s, so mcode_test.py's no-answer case is short.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGFMCODE_WAIT_S=5.0
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Switch-map decode truth table
        run: ./build/switch_map_test
      - name: Operator-arm coolant re-check (G-4) and arm on every laser-on
        run: ./build/laser_arm_test
      - name: RX ring under a sender that ignores flow control, the -b listen address, and the start notice with its list of environment overrides
        run: ./build/serial_test
      - name: Z after a home sits on the step grid and the park stays inside the window
        run: ./build/lens_home_test
      - name: XY microstep scale derivations
        run: ./build/xy_scale_test
      - name: Laser latch writer (retries, ownership, the run-start relight) and the kernel run requests (the deferred run, the underrun)
        run: ./build/latch_test
      - name: Cooling client verdict tiers
        run: ./build/cooling_test
      - name: Lid cancel under a failed switch read
        run: ./build/switches_test
      # The safety harnesses live in the forgefirm repo (scripts/bench/)
      # and drive the null-sink build over TCP - no hardware, no root. They
      # come from forgefirm's master (its next in a run on next) at the
      # time of the run, unpinned: a harness change is pushed before the
      # driver change that needs it, and a rerun of an old commit runs
      # today's harnesses (the push order, forgefirm-docs release-flow.md).
      - name: Fetch the test harnesses
        uses: actions/checkout@v4
        with:
          repository: openglow-org/forgefirm
          ref: ${{ (github.ref_name == 'next' || github.base_ref == 'next') && 'next' || '' }}
          path: forgefirm
      # The board runs the controller with cap_sys_nice, so its producer
      # runs SCHED_FIFO and keeps its lead on a busy host. Without it a
      # loaded runner can starve the producer inside an armed window, and
      # the stream faults the run on purpose. A harness reruns a session
      # starved that way once, from a new controller; a second starve
      # fails it.
      - name: Give the controller cap_sys_nice, as the board does
        run: sudo setcap cap_sys_nice+ep build/grblHAL_glowforge
      - name: Laser stream emission rules
        run: python3 forgefirm/scripts/bench/laser_stream_test.py build/grblHAL_glowforge
      - name: Armed-window lifecycle
        run: python3 forgefirm/scripts/bench/laser_lifecycle_test.py build/grblHAL_glowforge
      - name: Z envelope survives a settings write
        run: python3 forgefirm/scripts/bench/z_envelope_test.py build/grblHAL_glowforge
      - name: XY microstep mode from the shared config
        run: python3 forgefirm/scripts/bench/xy_mode_test.py build/grblHAL_glowforge
      - name: A deep planner buffer starts
        run: python3 forgefirm/scripts/bench/planner_blocks_test.py build/grblHAL_glowforge
      - name: Controller port keeps the sender's response count
        run: python3 forgefirm/scripts/bench/ctlport_test.py build/grblHAL_glowforge
      - name: An M-code a package answers is a dark barrier, bounded, and held on a refusal
        run: python3 forgefirm/scripts/bench/mcode_test.py build/grblHAL_glowforge
      - name: The measured envelope, and the bed check's open envelope is the port's jogs' alone
        run: python3 forgefirm/scripts/bench/envelope_test.py build/grblHAL_glowforge
      - name: Manual home declares the gantry stops, jogs dark to an offset origin, and a released gantry stays released
        run: python3 forgefirm/scripts/bench/manual_home_test.py build/grblHAL_glowforge
      - name: Every cooling report carries the supervisor's secret, and only the homing runner is handed it
        run: python3 forgefirm/scripts/bench/cool_report_test.py build/grblHAL_glowforge
      - name: The crumb tray moves Z and its envelope by the offset, persists, and moves nothing
        run: python3 forgefirm/scripts/bench/tray_test.py build/grblHAL_glowforge

  # The build that ships: the board's 32-bit armhf target with the image's
  # tune (cortex-a9, NEON, hard float), its hardening flags and 64-bit time,
  # the driver held to -Wall -Wextra -Werror. Compile only.
  armhf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: The armhf cross compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-linux-gnueabihf
      - name: Configure for the board, with the image's flags
        run: >-
          cmake -B build-armhf -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=arm
          -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS_RELEASE=-DNDEBUG
          "-DCMAKE_C_FLAGS=-mthumb -mfpu=neon -mfloat-abi=hard -mcpu=cortex-a9 -O2 -pipe -g
          -fstack-protector-strong -D_FORTIFY_SOURCE=2 -Wformat -Wformat-security -Werror=format-security
          -D_TIME_BITS=64 -D_FILE_OFFSET_BITS=64"
      - name: Build
        run: cmake --build build-armhf -j"$(nproc)"

  # The eight unit tests under AddressSanitizer and UndefinedBehaviorSanitizer:
  # a report fails the test.
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure with ASan and UBSan
        run: >-
          cmake -B build-san -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
      - name: Build the unit tests
        run: >-
          cmake --build build-san -j"$(nproc)" --target switch_map_test laser_arm_test serial_test
          lens_home_test xy_scale_test latch_test cooling_test switches_test
      - name: The unit tests under the sanitizers
        run: |
          for t in switch_map_test laser_arm_test serial_test lens_home_test xy_scale_test latch_test cooling_test switches_test; do
            ./build-san/$t
          done
